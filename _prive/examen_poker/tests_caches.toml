[[groupes]]
theme = "comptage"
appels = [
    "analyser_comptage({1: 1})",
    "analyser_comptage({1: 1, 2: 1, 3: 1, 4: 1, 5: 1})",
    "analyser_comptage({1: 3, 6: 2})",
    "analyser_comptage({6: 2, 1: 3})",
    "analyser_comptage({3: 4, 5: 1})",
    "analyser_comptage({5: 1, 6: 1, 2: 1})",
    "analyser_comptage({2: 2, 4: 2})",
    "analyser_comptage({6: 1, 5: 2, 1: 2})",
]

[[groupes]]
theme = "comparaison"
controle = "signe"
appels = [
    "comparer_tirages([6, 6, 6, 6, 6], [5, 5, 5, 5, 5])",
    "comparer_tirages([1, 1, 1, 6, 6], [6, 6, 5, 5, 4])",
    "comparer_tirages([6, 6, 5, 5, 4], [1, 1, 1, 6, 6])",
    "comparer_tirages([3, 3, 3, 3, 5], [1, 1, 1, 1, 1])",
    "comparer_tirages([6, 2, 3, 4, 5], [5, 4, 3, 2, 1])",
    "comparer_tirages([6, 2, 3, 4, 5], [6, 1, 3, 4, 5])",
    "comparer_tirages([2, 2, 4, 4, 1], [4, 4, 3, 5, 6])",
    "comparer_tirages([1], [2])",
    "comparer_tirages([1, 1], [6, 5, 4, 3, 2])",
    "comparer_tirages([3], [3])",
    "comparer_tirages([6, 6], [6, 6, 5, 5, 1])",
]

[[groupes]]
theme = "détail"
appels = [
    "detailler_tirage_des({6: 5})",
    "detailler_tirage_des({3: 1})",
    "detailler_tirage_des({6: 1, 1: 4})",
    "detailler_tirage_des({5: 2, 2: 2, 4: 1})",
    "detailler_tirage_des({6: 2, 3: 1})",
]

[[groupes]]
theme = "affichage"
appels = [
    "afficher_tirage([])",
    "afficher_tirage([6])",
    "afficher_tirage([0, 6, 0])",
    "afficher_tirage([1, 2, 3, 4, 5, 6])",
    "afficher_tirage([4, 4, 0, 6, 6, 6])",
]

[[groupes]]
theme = "sélection"
ignorer_sortie = true
tests = [
    { appel = "selectionner_des([1, 0, 2, 0, 3, 0, 4, 0, 5])", entree = [""] },
    { appel = "selectionner_des([1, 0, 2, 0, 3, 0, 4, 0, 5])", entree = ["- - - - -"] },
    { appel = "selectionner_des([1, 1, 0, 2, 0, 4, 0, 5])", entree = ["--------"] },
    { appel = "selectionner_des([6, 6, 6, 6, 6])", entree = ["-----------"] },
    { appel = "selectionner_des([6, 6, 6, 6, 6])", entree = ["-- -"] },
    { appel = "selectionner_des([1, 0, 5])", entree = [" - "] },
    { appel = "selectionner_des([1, 0, 5])", entree = ["    -"] },
    { appel = "selectionner_des([3])", entree = ["-"] },
    { appel = "selectionner_des([2, 2, 0, 5, 0, 6])", entree = [" -"] },
]

[[groupes]]
theme = "partie"
controle = "resume_partie"
tests = [
    { graine = 1, entree = ["", "", ""] },
    { graine = 2, entree = ["-", "", ""] },
    { graine = 3, entree = ["----------"] },
    { graine = 4, entree = ["-", "-", "-"] },
    { graine = 5, entree = ["  -", "----------"] },
    { graine = 6, entree = ["--", "", "----------"] },
    { graine = 7, entree = ["- -", "-", ""] },
    { graine = 8, entree = ["---", " ", "--"] },
    { graine = 11, entree = ["", "----------"] },
    { graine = 26, entree = ["-----------"] },
    { graine = 14, entree = ["-----------"] },
    { graine = 9, entree = ["--", "-", ""] },
    { graine = 15, entree = ["--", "-", ""] },
]
