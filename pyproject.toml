# No [project] table on purpose: PyCharm would replace the module configured by
# prb/pycharm.py (excluded folders, sources root) with its own.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["mes_solutions", "sources"]

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I", "B", "UP"]
